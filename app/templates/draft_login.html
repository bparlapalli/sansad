{% extends "base.html" %}
{% block title %}Private draft — sign in{% endblock %}
{% block content %}
<div style="max-width:380px;margin:60px auto;padding:0 20px;font-family:sans-serif;">
  <h1 style="font-family:Georgia,serif;font-size:1.6rem;margin-bottom:6px;">Private draft</h1>
  <p style="color:#555;font-size:.9rem;margin-bottom:18px;">Unverified research. Enter the password you were given.</p>
  {% if error %}<p style="color:#b3261e;font-size:.9rem;margin-bottom:12px;">{{ error }}</p>{% endif %}
  <form method="post" style="display:flex;gap:8px;">
    <input type="password" name="password" autofocus autocomplete="current-password" required
           style="flex:1;padding:9px 12px;border:1px solid #cfcfc6;border-radius:6px;font-size:1rem;">
    <button type="submit" style="padding:9px 18px;background:#0f2818;color:#fff;border:0;border-radius:6px;font-size:.95rem;cursor:pointer;">Enter</button>
  </form>
</div>
{% endblock %}
