services:
  - type: web
    name: paramasrota
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app.app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: SANSAD_DB_PATH
        value: /opt/render/project/src/public.db
      - key: INGEST_TOKEN
        sync: false   # set manually in the Render dashboard — never commit this
      - key: DRAFT_PASSWORD
        sync: false   # optional: set in the Render dashboard to lock /draft behind a password
