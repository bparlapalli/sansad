*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px 4px}
h1{font-size:17px;margin:0 0 2px}
.sub{color:var(--mute);font-size:12px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:4px 16px}
.bar label{font-size:12px;color:var(--mute);display:flex;gap:4px;align-items:center}
button,select{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;max-width:100%}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button{padding:5px 12px}
.summary{padding:2px 16px 6px;color:var(--mute);font-size:13px;max-width:980px}
#wrap{padding:0 16px 12px}
html,body{max-width:100%;overflow-x:hidden}
#chart{max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:pan-y}
svg{display:block;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px;font-size:12px;color:var(--mute);align-items:center}
.legend svg{display:inline-block;vertical-align:middle}
#detail{margin:0 16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:980px}
#detail h2{font-size:15px;margin:0 0 4px}
.meta{color:var(--mute);font-size:12px;margin-bottom:6px}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--ink);margin-right:4px}
.badge.confirmed{background:var(--ink);color:var(--bg)}
.badge.reported{background:transparent}
.badge.disputed{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.badge.inferred{border-style:dashed}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px;cursor:pointer}
.chips span:hover{border-color:var(--ink)}
.chips span.hl{background:var(--ink);color:var(--bg)}
.chips em{color:var(--mute);font-style:normal;font-size:11px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:12px 0 4px}
ul{margin:0;padding-left:18px}
li{margin:2px 0}
a{color:var(--acc)}
.lk{cursor:pointer;text-decoration:underline dotted}
.box{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0;background:var(--bg)}
.box.dash{border-style:dashed}
.why{border-left:3px dashed var(--mute);padding-left:8px;margin:6px 0;color:var(--ink)}
.hop{margin:2px 0 2px 10px;padding-left:10px;font-size:12px;color:var(--mute);border-left:3px solid var(--ink)}
.hop.d{border-left:3px dashed var(--mute)}
.note{font-size:12px;color:var(--mute)}
.pill{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--mute)}
@media (max-width:640px){.bar{padding:4px 10px}header,.summary,.legend{padding-left:10px;padding-right:10px}#wrap{padding:0 10px 10px}#detail{margin:0 10px 20px}}

    HYP.forEach(h=>{const [a,b]=h.between||[];const p=POS[a],q=POS[b];if(!p||!q)return;const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
      hyp+=`<g class="hy" data-hyp="${h.id}" style="cursor:pointer"><path d="M${p.x},${p.y} C${p.x+30},${my} ${q.x-30},${my} ${q.x},${q.y}" fill="none" stroke="#b83280" stroke-width="1.8" stroke-dasharray="5 4"/><circle cx="${mx}" cy="${my}" r="8" fill="var(--panel)" stroke="#b83280" stroke-dasharray="2 2"/><text x="${mx}" y="${my+3.5}" text-anchor="middle" font-size="10" fill="#b83280">H</text><title>${esc("Hypothesis ("+h.status+", internal): "+h.statement)}</title></g>`});
  }
  $("chart").innerHTML=`<svg id="svg" width="${W}" height="${H}"><defs><clipPath id="cp"><rect x="${LG}" y="0" width="${W-LG-R}" height="${H}"/></clipPath></defs>${grid}${body}<g clip-path="url(#cp)">${serSvg}</g>${links}${hyp}</svg>`;
  $("svg").addEventListener("click",ev=>{const hy=ev.target.closest(".hy");if(hy){S.selHyp=hy.getAttribute("data-hyp");S.sel=null;render();return}const g=ev.target.closest(".mk");if(g){S.selHyp=null;select(g.getAttribute("data-id"),true)}});
  bindPanZoom(W,LG,R);
  const n=rows.reduce((a,r)=>a+(r.ghost?0:r.items.length),0);
  $("summary").innerHTML=S.mode==="issue"?esc(issueOf(S.issue).summary||"")+` <span class="note">(${n} events shown${S.hl?", "+hlItems+" involve “"+esc(ENT[S.hl].name)+"”":""})</span>`:`Lens: every event matching the selection, one row per issue. ${n} event-rows.`;
  renderDetail();
}
function renderTabs(){
  $("tabs").innerHTML=ISS.filter(i=>i.file).map(i=>`<button class="${S.mode==="issue"&&S.issue===i.slug?"on":""}" data-issue="${i.slug}" style="border-left:5px solid ${i.color}">${esc(i.title)}</button>`).join("")+`<button class="${S.mode==="lens"?"on":""}" data-mode="lens">Lens (cross-issue)</button>`;
  $("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.mode){S.mode="lens"} else {S.mode="issue";S.issue=b.dataset.issue} resetZoom(); render(); });
}
function entOptions(types){
  const list=Object.values(ENT).filter(e=>!types||types.includes(e.type)); const depth=e=>path(e.id).length-1;
  const byType={}; list.forEach(e=>(byType[e.type]=byType[e.type]||[]).push(e));
  return Object.entries(byType).map(([t,l])=>`<optgroup label="${t}">`+l.sort((a,b)=>path(a.id).join(">").localeCompare(path(b.id).join(">"))).map(e=>`<option value="${e.id}">${"  ".repeat(depth(e))}${esc(e.name)}${e.hub?" (hub)":""}</option>`).join("")+`</optgroup>`).join("");
}
function renderCtl(){
  let h=`<label><input type="checkbox" id="oc" ${S.onlyConf?"checked":""}> hide non-confirmed</label><label><input type="checkbox" id="scl" ${S.showClaims?"checked":""}> show claims</label>`;
  if(S.mode==="issue"){
    h+=`<label title="Proposed connections between events; internal working layer, not for public display"><input type="checkbox" id="shy" ${S.showHyp?"checked":""}> hypotheses (internal, dashed)</label>`;
    h+=`<label><input type="checkbox" id="sh" ${S.showHub?"checked":""}> show hub entities (BJP, INC, Govt, courts, Delhi…) in connected lane</label>`;
    h+=`<label>highlight <select id="hl"><option value="">(none)</option>${entOptions()}</select></label>`;
    if(S.hl)h+=`<button id="clr">clear</button>`;
  } else {
    h+=`<label>lens <select id="lt">${["person","place","org","party","document","kind"].map(t=>`<option ${S.lensType===t?"selected":""} value="${t}">${t==="kind"?"event kind / action":t}</option>`).join("")}</select></label>`;
    h+=`<label><select id="lv"><option value="">(choose)</option>${S.lensType==="kind"?KINDS.map(k=>`<option value="${k}">${k}</option>`).join(""):entOptions([S.lensType])}</select></label>`;
    h+=`<span class="note">places roll up to their parents (e.g. Manipur includes Churachandpur)</span>`;
  }
  $("ctl").innerHTML=h;
  $("oc").onchange=e=>{S.onlyConf=e.target.checked;render()};
  $("scl").onchange=e=>{S.showClaims=e.target.checked;render()};
  if($("shy"))$("shy").onchange=e=>{S.showHyp=e.target.checked;render()};
  if($("sh"))$("sh").onchange=e=>{S.showHub=e.target.checked;render()};
  if($("hl")){$("hl").value=S.hl||"";$("hl").onchange=e=>{S.hl=e.target.value||null;render()}}
  if($("clr"))$("clr").onclick=()=>{S.hl=null;render()};
  if($("lt"))$("lt").onchange=e=>{S.lensType=e.target.value;S.lensVal="";resetZoom();render()};
  if($("lv")){$("lv").value=S.lensVal;$("lv").onchange=e=>{S.lensVal=e.target.value;resetZoom();render()}}
}
function renderLegend(){
  const c="#555", m=(sh)=>`<svg width="16" height="16" viewBox="-8 -8 16 16">${sh}</svg>`;
  $("legend").innerHTML=
   m(`<circle r="6" fill="${c}"/>`)+"confirmed "+
   m(`<circle r="6" fill="var(--panel)" stroke="${c}" stroke-width="2"/>`)+"reported (one outlet) "+
   m(`<circle r="6" fill="var(--panel)" stroke="${c}" stroke-width="2"/><path d="M0,-6 A6,6 0 0 0 0,6 Z" fill="${c}"/>`)+"disputed (split) "+
   m(`<rect x="-5" y="-5" width="10" height="10" transform="rotate(45)" fill="var(--panel)" stroke="${c}" stroke-width="2" stroke-dasharray="2.5 2"/>`)+"inferred (dashed diamond; reasoning on click) "+
   m(`<path d="M-7,-6 h14 a2,2 0 0 1 2,2 v7 a2,2 0 0 1 -2,2 h-6 l-4,4 v-4 h-4 a2,2 0 0 1 -2,-2 v-7 a2,2 0 0 1 2,-2 z" fill="${c}"/>`)+"claim (someone alleged X: the statement is sourced, its content is not) "+
   m(`<circle r="7" fill="var(--panel)" stroke="#b83280" stroke-dasharray="2 2"/><text y="3.5" text-anchor="middle" font-size="9" fill="#b83280">H</text>`)+"hypothesis link (internal layer) "+
   ISS.map(i=>`<span><span style="display:inline-block;width:10px;height:10px;background:${i.color};border-radius:2px"></span> ${esc(i.title.length>34?i.title.slice(0,33)+"…":i.title)}</span>`).join(" ");
}
function renderZoom(rows){
  const years=[...new Set(rows.filter(r=>!r.ghost).flatMap(r=>r.items.map(i=>+i.e.date.slice(0,4))))].sort();
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let h=`<span class="note">zoom:</span><button id="zall" class="${S.year==null?"on":""}">all</button>`+years.map(y=>`<button data-y="${y}" class="${S.year===y?"on":""}">${y}</button>`).join("");
  if(S.year!=null)h+=`<span class="note">month:</span>`+M.map((m,i)=>`<button data-m="${i}" class="${S.month===i?"on":""}">${m}</button>`).join("");
  if(S.trim>0||S.full)h+=`<button id="zfull" class="${S.full?"on":""}" title="default view trims isolated early/late events">${S.full?"trimmed view":"full range (+"+S.trim+" outlying)"}</button>`;
  h+=`<span class="note">wheel/drag to zoom & pan</span>`;
  $("zoombar").innerHTML=h;
  $("zall").onclick=()=>{resetZoom();render()};
  if($("zfull"))$("zfull").onclick=()=>{S.full=!S.full;resetZoom();render()};
  $("zoombar").querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{S.year=+b.dataset.y;S.month=null;S.t0=Date.UTC(S.year,0,1);S.t1=Date.UTC(S.year+1,0,1);render()});
  $("zoombar").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=+b.dataset.m;S.month=m;S.t0=Date.UTC(S.year,m,1);S.t1=Date.UTC(S.year,m+1,1);render()});
}
function resetZoom(){S.year=null;S.month=null;S.t0=null;S.t1=null}
let DRAG=null, LAY={W:900,LG:118,R:10};
window.addEventListener("pointermove",ev=>{if(!DRAG)return;const dt=(ev.clientX-DRAG.x)/(LAY.W-LAY.LG-LAY.R)*(DRAG.t1-DRAG.t0);S.t0=DRAG.t0-dt;S.t1=DRAG.t1-dt;S.year=null;S.month=null;cancelAnimationFrame(DRAG.raf);DRAG.raf=requestAnimationFrame(render)});
window.addEventListener("pointerup",()=>{DRAG=null});
function bindPanZoom(W,LG,R){
  const svg=$("svg"); LAY={W,LG,R};
  svg.addEventListener("wheel",ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();const f=(ev.clientX-r.left-LG)/(W-LG-R);const c=S.t0+f*(S.t1-S.t0);const k=ev.deltaY<0?0.75:1.33;S.t0=c-(c-S.t0)*k;S.t1=c+(S.t1-c)*k;S.year=null;S.month=null;render()},{passive:false});
  svg.addEventListener("pointerdown",ev=>{if(ev.target.closest(".mk")||ev.target.closest(".hy"))return;DRAG={x:ev.clientX,t0:S.t0,t1:S.t1,raf:0}});
}

// ---------- selection & detail ----------
function select(id,jump){
  const e=EV[id]; if(!e)return; S.sel=id; S.selHyp=null;
  if(jump&&S.mode==="issue"&&!e.issues.includes(S.issue)){const t=ISS.find(i=>i.file&&e.issues.includes(i.slug)); if(t){S.issue=t.slug;resetZoom()}}
  render();
}
const fmtDate=e=>e.date_precision==="month"?e.date.slice(0,7)+" (month precision)":e.date_precision==="approx"?e.date+" (approx.)":e.date;
function evLink(id,extra){const e=EV[id];if(!e)return esc(id);return `<span class="lk" data-go="${id}">${esc(e.date)} &middot; ${esc(e.title.length>90?e.title.slice(0,89)+"…":e.title)}</span> <span class="badge ${e.evidence}">${e.evidence}</span>${extra||""}`}
function hypBox(h){
  const L=ids=>(ids||[]).length?"<ul>"+ids.map(i=>`<li>${evLink(i)}</li>`).join("")+"</ul>":"<span class=note>none recorded</span>";
  return `<div class="box dash"><b>Hypothesis <span class="badge inferred">${esc(h.status)}</span> <span class="pill">internal / not for public display</span></b><p style="margin:4px 0">${esc(h.statement)}</p>`+
   (h.between?`<div class="note">Proposed link: ${evLink(h.between[0])} &harr; ${evLink(h.between[1])}</div>`:"")+
   `<h3>Supporting</h3>${L(h.supporting)}<h3>Counter-evidence</h3>${L(h.counter)}`+
   ((h.alternatives||[]).length?`<h3>Alternative explanations</h3><ul>${h.alternatives.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:"")+
   `<h3>Would confirm / refute</h3><p style="margin:0">${esc(h.would_confirm||"")}</p></div>`;
}
function renderDetail(){
  const e=EV[S.sel]; const box=$("detail");
  if(S.selHyp){const h=HYP.find(x=>x.id===S.selHyp); if(h){box.innerHTML=hypBox(h);box.querySelectorAll("[data-go]").forEach(n=>n.onclick=()=>select(n.dataset.go,true));return}}
  if(!e){box.innerHTML=`<span class="note">Click a marker to see details, sources and connections. Click an entity chip to highlight it across both issues. The bottom “connected” lane shows faded events from other issues that share a (non-hub) entity or an explicit link with the issues on screen.</span>`;return}
  let h=`<h2>${esc(e.title)}</h2><div class="meta"><span class="badge ${e.evidence}">${e.evidence}</span> ${esc(fmtDate(e))} &middot; lane: ${esc(e.lane)} &middot; kind: <span class="lk" data-kind="${esc(e.kind||"")}">${esc(e.kind||"-")}</span> &middot; issues: ${e.issues.map(s=>`<b style="color:${issueOf(s).color}">${esc(issueOf(s).title)}</b>`).join(", ")}${e.issues.length>1?' <span class="pill">shared event</span>':""}</div>`;
  h+=`<p style="margin:4px 0">${esc(e.summary)}</p>`;
  if(e.kind==="claim"){
    h+=`<div class="box"><b>Claim</b> &mdash; made by <span class="lk" data-ent2="${e.claimant}">${esc(ENT[e.claimant].name)}</span><blockquote style="margin:4px 0;padding-left:8px;border-left:3px solid var(--line)">${esc(e.claim_text)}</blockquote>`+
      `<span class="badge ${e.evidence}">the statement was made: ${e.evidence}</span> <span class="badge ${e.content_evidence==="supported"?"confirmed":e.content_evidence==="refuted"?"inferred":"reported"}">content: ${e.content_evidence}</span>`+
      ((e.about||[]).length?`<div class="note">About: ${e.about.map(a=>EV[a]?evLink(a):esc(ENT[a]?ENT[a].name:a)).join("; ")}</div>`:"")+`</div>`;
  }
  const hy=HYP.filter(x=>(x.between||[]).includes(e.id)||(x.supporting||[]).includes(e.id)||(x.counter||[]).includes(e.id));
  if(e.reasoning)h+=`<div class="why"><b>${e.evidence==="disputed"?"Conflicting accounts":"Reasoning"}:</b> ${esc(e.reasoning)}${e.would_confirm?`<br><b>Would confirm / upgrade:</b> ${esc(e.would_confirm)}`:""}</div>`;
  h+=`<h3>Entities (click to highlight)</h3><div class="chips">`+e.entities.map(x=>`<span data-ent="${x.id}" class="${S.hl===x.id?"hl":""}" title="${esc(path(x.id).join(" › "))}">${esc(ENT[x.id].name)} <em>${esc(x.role)}${ENT[x.id].hub?", hub":""}</em></span>`).join("")+`</div>`;
  if(e.mentions.length)h+=`<h3>Mentions</h3><ul>`+e.mentions.map(m=>`<li>${evLink(m)}</li>`).join("")+`</ul>`;
  const outs=e.links.map(l=>({id:cid(l.to),rel:l.relation,ev:l.evidence,dir:"→"}));
  EVL.forEach(o=>o.links.forEach(l=>{if(cid(l.to)===e.id)outs.push({id:o.id,rel:l.relation,ev:l.evidence,dir:"←"})}));
  EVL.forEach(o=>{if(o.mentions.includes(e.id))outs.push({id:o.id,rel:"mentions this",ev:"reported",dir:"←"})});
  if(outs.length)h+=`<h3>Links</h3><ul>`+outs.map(o=>{const t=EV[o.id];const x=t&&!t.issues.some(s=>e.issues.includes(s));return `<li>${o.dir} <i>${esc(o.rel)}</i> [${o.ev}${o.ev==="inferred"?", dashed":""}] ${evLink(o.id,x?' <span class="pill">other issue</span>':"")}</li>`}).join("")+`</ul>`;
  if(hy.length)h+=`<h3>Hypotheses touching this event (internal layer)</h3>`+hy.map(hypBox).join("");
  h+=`<h3>Sources (${e.sources.length})</h3><ul>`+e.sources.map(s=>s.type==="sansad_db"?`<li><b>sansad.db</b> <code>${esc(s.table)}#${esc(s.row_id)}</code> ${esc(s.title||"")}${s.note?` <span class="note">(${esc(s.note)})</span>`:""}</li>`:`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a> <span class="note">${esc(s.outlet||"")}${s.note?" — "+esc(s.note):""}; accessed ${esc(s.accessed)}</span></li>`).join("")+`</ul>`;
  // path tracer
  const others=EVL.filter(o=>o.id!==e.id).sort((a,b)=>(a.issues[0]===e.issues[0])-(b.issues[0]===e.issues[0])||a.date.localeCompare(b.date));
  h+=`<h3>Trace a path to another event (strength = weakest hop)</h3><select id="ptarget"><option value="">(choose event)</option>${others.map(o=>`<option value="${o.id}">${esc(o.issues[0].slice(0,4))} · ${o.date} · ${esc(o.title.slice(0,70))}</option>`).join("")}</select><div id="ptrace"></div>`;
  box.innerHTML=h;
  box.querySelectorAll("[data-go]").forEach(n=>n.onclick=()=>select(n.dataset.go,true));
  box.querySelectorAll("[data-ent2]").forEach(n=>n.onclick=()=>{S.hl=n.dataset.ent2;render()});
  box.querySelectorAll("[data-ent]").forEach(n=>n.onclick=()=>{S.hl=(S.hl===n.dataset.ent)?null:n.dataset.ent;render()});
  box.querySelectorAll("[data-kind]").forEach(n=>n.onclick=()=>{if(!n.dataset.kind)return;S.mode="lens";S.lensType="kind";S.lensVal=n.dataset.kind;resetZoom();render()});
  $("ptarget").onchange=ev=>{
    const t=ev.target.value; if(!t){$("ptrace").innerHTML="";return}
    const r=widest(e.id,t); if(!r){$("ptrace").innerHTML=`<div class="note">No path found through the current links/co-occurrences.</div>`;return}
    const names={4:"confirmed",3:"reported",2:"disputed",1:"inferred / co-occurrence only"};
    let o=`<div class="box ${r.strength===1?"dash":""}"><b>Path strength: ${names[r.strength]}</b> (${r.hops.length} hop${r.hops.length>1?"s":""}${r.strength===1?"; dashed because at least one hop is inferred":""})<br>${evLink(e.id)}`;
    r.hops.forEach(h=>{o+=`<div class="hop ${h.ed.s===1?"d":""}">${esc(h.ed.label)} — strength ${h.ed.s>=4?"confirmed":h.ed.s===3?"reported":h.ed.s===2?"disputed":"inferred"}</div>${evLink(h.to)}<br>`});
    $("ptrace").innerHTML=o+"</div>";
    $("ptrace").querySelectorAll("[data-go]").forEach(n=>n.onclick=()=>select(n.dataset.go,true));
  };
}
window.addEventListener("resize",()=>{clearTimeout(window._rt);window._rt=setTimeout(render,120)});
(function(){ // optional deep link: #issue=sterlite-copper&sel=s24&hyp=1&hub=1&hl=cji&lens=person:cji
  const h=new URLSearchParams((location.hash||"").slice(1));
  if(h.get("issue")&&ISS.find(i=>i.slug===h.get("issue")))S.issue=h.get("issue");
  if(h.get("sel")&&EV[h.get("sel")])S.sel=h.get("sel");
  if(h.get("hyp"))S.showHyp=true; if(h.get("hub"))S.showHub=true; if(h.get("hl")&&ENT[h.get("hl")])S.hl=h.get("hl");
  if(h.get("lens")){S.mode="lens";const p=h.get("lens").split(":");S.lensType=p[0];S.lensVal=p[1]||""}
})();
render();
</script>
</body>
